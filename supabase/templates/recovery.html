<!-- Password reset email. Shows only the 6-digit code (no link) so the owner never leaves the app. -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111111; max-width: 480px;">
  <h2 style="margin: 0 0 12px;">Reset your KILN password</h2>
  <p style="margin: 0 0 16px;">Type this code in the KILN app:</p>
  <p style="font-size: 36px; font-weight: 800; letter-spacing: 8px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0 0 8px;">The code works for 1 hour.</p>
  <p style="margin: 0; color: #555555;">If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</p>
</div>
